<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Message in a Bottle — Hudson River</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,serif;background:#071724;color:#fff}
body{display:flex;justify-content:center;padding:18px}
#game{position:relative;width:min(1200px,100%);height:min(760px,calc(100vh - 36px));min-height:620px;overflow:hidden;border-radius:20px;background:#78b9d4;box-shadow:0 20px 70px #0008;isolation:isolate}

/* ---------- Scene ---------- */
.sky{position:absolute;inset:0 0 50%;overflow:hidden;background:linear-gradient(#82c5eb 0%,#dcecf0 70%,#b6d4d5 100%);transition:background .7s}
.sky::after{content:"";position:absolute;inset:0;background:url('assets/day-background.png') center/cover no-repeat;opacity:.10;mix-blend-mode:multiply;pointer-events:none}
.sun{position:absolute;width:96px;height:96px;border-radius:50%;background:#ffe8a6;right:24%;top:14%;box-shadow:0 0 55px #ffe8a6;transition:.7s}
.cloud{position:absolute;background:#fff9;border-radius:50px;filter:blur(1px)}
.c1{width:170px;height:32px;left:17%;top:22%}.c2{width:130px;height:25px;right:8%;top:29%}
.scene-buttons{position:absolute;z-index:40;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:6px;background:#061d2ccc;padding:5px;border-radius:18px;font:12px system-ui,sans-serif}
.scene-buttons button{border:0;background:transparent;color:#fff;padding:6px 10px;border-radius:13px;cursor:pointer}.scene-buttons button.active{background:#ffffff2b}

.horizon{position:absolute;z-index:2;bottom:0;height:145px}
.west-land{left:0;width:45%;height:165px;bottom:0;position:absolute;overflow:hidden}
.west-land img{position:absolute;bottom:0;left:0;width:100%;height:150px;object-fit:cover;object-position:center 42%;mix-blend-mode:normal;filter:saturate(.9) contrast(1.02);mask-image:linear-gradient(to top,#000 0 76%,transparent 100%)}
.manhattan-land{right:0;width:45%;height:170px;bottom:0;position:absolute;overflow:hidden}
.manhattan-land img{position:absolute;bottom:0;right:0;width:100%;height:155px;object-fit:cover;object-position:center 44%;mask-image:linear-gradient(to top,#000 0 76%,transparent 100%)}
.highlands{position:absolute;z-index:1;left:25%;right:25%;bottom:0;height:130px;overflow:hidden;opacity:.9}
.highlands img{width:100%;height:130px;object-fit:cover;object-position:center 45%;mask-image:linear-gradient(to top,#000 0 65%,transparent 100%)}

.land-label{position:absolute;z-index:5;bottom:9px;font:bold 13px system-ui,sans-serif;letter-spacing:2px;text-shadow:0 2px 6px #000;white-space:nowrap}
.land-label.w{left:25px}.land-label.m{right:25px}

/* ---------- River ---------- */
.river{position:absolute;z-index:3;left:0;right:0;top:49%;bottom:0;overflow:hidden;background:linear-gradient(#438eac,#216b89 50%,#154f69);transition:background .7s}
.river::before{content:"";position:absolute;inset:0;background:url('assets/water-reflections.png') center/cover;opacity:.22;mix-blend-mode:screen;animation:waterDrift 18s linear infinite}
.river::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 34px,#ffffff12 35px 37px);pointer-events:none}
@keyframes waterDrift{from{background-position:0 0}to{background-position:500px 35px}}

/* ---------- Boats ---------- */
.boat{position:absolute;z-index:7;pointer-events:none;filter:drop-shadow(0 6px 4px #0005)}
.boat img{display:block;width:100%;height:auto}
.boat .wake{position:absolute;z-index:-1;opacity:.65;pointer-events:none}
.b1{width:175px;top:12%;left:-200px;animation:boatRight 24s linear infinite}
.b2{width:125px;top:44%;right:-160px;animation:boatLeft 16s linear infinite}
.b3{width:125px;top:70%;left:-160px;animation:boatRight 30s linear infinite}
.b4{width:155px;top:27%;right:-190px;animation:boatLeft 21s linear infinite}
.b1 .wake,.b4 .wake{width:125px;left:-85px;top:48%}
.b2 .wake{width:105px;left:-72px;top:48%}
.b3 .wake{width:105px;left:-68px;top:48%}
@keyframes boatRight{from{left:-22%}to{left:112%}}
@keyframes boatLeft{from{right:-22%}to{right:112%}}

/* ---------- Bottle ---------- */
.bottle-wrap{position:absolute;z-index:15;left:-120px;top:36%;width:92px;cursor:pointer;animation:bottleDrift 15s linear infinite;filter:drop-shadow(0 7px 5px #0005)}
.bottle-wrap img{width:100%;display:block}
.bottle-wrap .wake{position:absolute;width:85px;left:-62px;top:38%;z-index:-1;opacity:.75}
@keyframes bottleDrift{
0%{left:-120px;top:37%;transform:rotate(-8deg)}
20%{top:44%;transform:rotate(5deg)}
40%{top:35%;transform:rotate(-4deg)}
60%{top:43%;transform:rotate(7deg)}
80%{top:34%;transform:rotate(-5deg)}
100%{left:110%;top:39%;transform:rotate(-7deg)}
}
.bottle-wrap.caught{animation:none!important;transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1);left:50%!important;top:50%!important;transform:translate(-50%,-50%) rotate(-7deg) scale(1.8)!important;cursor:default}
.bottle-wrap.caught .wake{display:none}

/* ---------- Controls ---------- */
.instructions{position:absolute;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);background:#061d2ccc;padding:10px 17px;border-radius:20px;font:14px system-ui,sans-serif;white-space:nowrap}
.status{position:absolute;z-index:40;top:14px;left:14px;background:#061d2ccc;padding:7px 11px;border-radius:15px;font:12px system-ui,sans-serif}
.share{position:absolute;z-index:40;top:14px;right:14px;background:#061d2ccc;padding:8px 12px;border-radius:15px;font:12px system-ui,sans-serif;cursor:pointer}

/* ---------- Modals ---------- */
.modal{position:absolute;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);display:none;width:min(520px,90%)}
.modal.show{display:block}
.paper{background:#fffaf0;color:#33291f;border-radius:8px;padding:30px;box-shadow:0 25px 70px #0009;transform:rotate(-1deg)}
.paper h2{margin-top:0}
.paper button,.composer button{border:0;border-radius:10px;padding:12px 18px;background:#315d72;color:white;font:bold 15px system-ui,sans-serif;cursor:pointer}
.composer{background:#071e2cf5;padding:22px;border-radius:15px;box-shadow:0 25px 70px #0009}
textarea{display:block;width:100%;height:150px;border:0;border-radius:10px;padding:14px;margin:10px 0 12px;font:16px system-ui,sans-serif;resize:none}
.toast{position:absolute;z-index:60;left:50%;top:70px;transform:translateX(-50%);background:#071e2cf5;padding:10px 15px;border-radius:10px;display:none;font:14px system-ui,sans-serif}

/* ---------- Scene themes ---------- */
#game.sunset .sky{background:linear-gradient(#e8784f 0%,#f5b56e 55%,#c78a75 100%)}
#game.sunset .sky::after{background-image:url('assets/sunset-background.png');opacity:.18}
#game.sunset .sun{background:#ffbd61;box-shadow:0 0 70px #ff9a45}
#game.sunset .river{background:linear-gradient(#a85e69,#6d536b 50%,#394861)}
#game.night .sky{background:linear-gradient(#09152e 0%,#162d4b 60%,#233d56 100%)}
#game.night .sky::after{background-image:url('assets/night-background.png');opacity:.24}
#game.night .sun{width:38px;height:38px;background:#f0f4ff;box-shadow:0 0 30px #fff8;right:17%;top:15%}
#game.night .cloud{background:#b8c9d31a}
#game.night .river{background:linear-gradient(#234b69,#12344e 50%,#0b2439)}
#game.night .river::before{opacity:.30}

@media(max-width:800px){
 #game{min-height:560px;height:calc(100vh - 36px)}
 .b1{width:140px}.b2{width:100px}.b3{width:100px}.b4{width:125px}
 .bottle-wrap{width:72px}
 .scene-buttons{top:auto;bottom:65px}
 .instructions{bottom:18px;font-size:12px}
}
</style>
</head>
<body>
<div id="game">
  <div class="status" id="status">Demo mode</div>
  <div class="share" id="share">Copy conversation link</div>
  <div class="toast" id="toast"></div>

  <div class="scene-buttons" aria-label="Scene selection">
    <button data-scene="day" class="active">Day</button>
    <button data-scene="sunset">Sunset</button>
    <button data-scene="night">Night</button>
  </div>

  <div class="sky">
    <div class="sun"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="highlands"><img src="assets/hudson-highlands.png" alt="Hudson Highlands"></div>
    <div class="west-land"><img src="assets/west-point.png" alt="West Point"></div>
    <div class="manhattan-land"><img src="assets/manhattan.png" alt="Manhattan skyline"></div>
    <div class="land-label w">WEST POINT</div>
    <div class="land-label m">MANHATTAN</div>
  </div>

  <div class="river">
    <div class="boat b1"><img src="assets/ferry.png" alt="Hudson ferry"><img class="wake" src="assets/boat-wake.png" alt=""></div>
    <div class="boat b2"><img src="assets/speedboat.png" alt="Speedboat"><img class="wake" src="assets/boat-wake.png" alt=""></div>
    <div class="boat b3"><img src="assets/sailboat.png" alt="Sailboat"><img class="wake" src="assets/boat-wake.png" alt=""></div>
    <div class="boat b4"><img src="assets/tourboat.png" alt="Tour boat"><img class="wake" src="assets/boat-wake.png" alt=""></div>

    <div class="bottle-wrap" id="bottle">
      <img src="assets/bottle.png" alt="Message in a bottle">
      <img class="wake" src="assets/bottle-wake.png" alt="">
    </div>

    <div class="instructions" id="instructions">Click the bottle to fish it out</div>
  </div>

  <div class="modal" id="letterModal">
    <div class="paper">
      <h2>💌 A Message from the Hudson</h2>
      <p id="messageText"></p>
      <p><em>— Someone across the river</em></p>
      <button id="replyButton">Write a reply</button>
    </div>
  </div>

  <div class="modal" id="composerModal">
    <div class="composer">
      <h2>🍾 Write your message</h2>
      <textarea id="replyText" placeholder="Write something to float down the Hudson..."></textarea>
      <button id="releaseButton">Release my bottle</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getFirestore, doc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID_HERE",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
  messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
  appId: "PASTE_YOUR_APP_ID_HERE"
};

const firebaseReady = !firebaseConfig.apiKey.includes("PASTE_");
const game=document.getElementById("game");
const river=document.querySelector(".river");
const bottle=document.getElementById("bottle");
const instructions=document.getElementById("instructions");
const status=document.getElementById("status");
const letterModal=document.getElementById("letterModal");
const composerModal=document.getElementById("composerModal");
const messageText=document.getElementById("messageText");
const replyButton=document.getElementById("replyButton");
const releaseButton=document.getElementById("releaseButton");
const replyText=document.getElementById("replyText");
const share=document.getElementById("share");
const toast=document.getElementById("toast");

const params=new URLSearchParams(location.search);
let conversationId=params.get("c");
if(!conversationId){
  conversationId=crypto.randomUUID().replaceAll("-","").slice(0,12);
  const u=new URL(location.href); u.searchParams.set("c",conversationId); history.replaceState({},"",u);
}

let messages=[];
let caught=false;
let demoReleaseHandler=null;

function showToast(text){toast.textContent=text;toast.style.display="block";setTimeout(()=>toast.style.display="none",1800)}
share.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);showToast("Conversation link copied!")}catch{prompt("Copy this conversation link:",location.href)}});

/* Scene switcher */
document.querySelectorAll(".scene-buttons button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const scene=btn.dataset.scene;
    game.classList.remove("sunset","night");
    if(scene!=="day") game.classList.add(scene);
    document.querySelectorAll(".scene-buttons button").forEach(b=>b.classList.toggle("active",b===btn));
  });
});

function resetBottle(){
  caught=false;
  bottle.classList.remove("caught");
  bottle.style.cssText="";
  bottle.style.display="block";
}

function catchBottle(){
  if(caught) return;
  caught=true;
  const br=bottle.getBoundingClientRect();
  const rr=river.getBoundingClientRect();
  bottle.style.animation="none";
  bottle.style.left=(br.left-rr.left)+"px";
  bottle.style.top=(br.top-rr.top)+"px";
  bottle.style.transform="rotate(-7deg) scale(1)";
  void bottle.offsetWidth;
  bottle.classList.add("caught");
  instructions.textContent="Bottle caught!";
  setTimeout(()=>{
    const latest=messages[messages.length-1];
    messageText.textContent=latest?.text || "The bottle is empty...";
    letterModal.classList.add("show");
  },950);
}
bottle.addEventListener("click",catchBottle);

replyButton.addEventListener("click",()=>{letterModal.classList.remove("show");composerModal.classList.add("show");replyText.focus()});

function setupDemo(){
  status.textContent="Demo mode — Firebase not connected";
  messages=[{id:"demo",text:"Hey! I found your bottle floating down the Hudson. Hope you're having a great day!"}];
  instructions.textContent="Click the bottle to fish it out";
  demoReleaseHandler=()=>{
    const text=replyText.value.trim();
    if(!text)return alert("Write a message first.");
    messages.push({id:String(Date.now()),text});
    replyText.value="";composerModal.classList.remove("show");letterModal.classList.remove("show");resetBottle();
    instructions.textContent="Your bottle is floating down the Hudson...";
  };
}

releaseButton.addEventListener("click",async()=>{
  if(!firebaseReady){demoReleaseHandler?.();return}
  const text=replyText.value.trim();
  if(!text)return alert("Write a message first.");
  try{
    await addDoc(messagesRef,{text,createdAt:serverTimestamp()});
    replyText.value="";composerModal.classList.remove("show");letterModal.classList.remove("show");resetBottle();
    instructions.textContent="Your bottle is floating down the Hudson...";
  }catch(error){console.error(error);alert("Could not send the message. Check Firebase configuration and Firestore rules.")}
});

let messagesRef;
if(!firebaseReady){
  setupDemo();
}else{
  try{
    const app=initializeApp(firebaseConfig);
    const db=getFirestore(app);
    messagesRef=collection(doc(db,"conversations",conversationId),"messages");
    const messagesQuery=query(messagesRef,orderBy("createdAt","asc"));
    onSnapshot(messagesQuery,(snapshot)=>{
      messages=snapshot.docs.map(d=>({id:d.id,...d.data()}));
      status.textContent="Firebase connected";
      instructions.textContent=messages.length?"A bottle is floating down the Hudson — catch it!":"Waiting for the first bottle...";
    },(error)=>{console.error(error);status.textContent="Firebase error";instructions.textContent="Check your Firestore rules/configuration."});
  }catch(error){console.error(error);setupDemo()}
}
</script>
</body>
</html>
